# The disk class driver retries a failed sector. A one-shot error is absorbed
# by that retry, and the formatter then reports success. Keep failing the
# NTFS boot sector, which is the first sector of the test partition (LBA 2048).
# The partition table at LBA 0 is left alone so the test can still open the volume.

[inject-error]
event = "write_aio"
errno = "5"
sector = "2048"

[inject-error]
event = "read_aio"
errno = "5"
sector = "4096"
